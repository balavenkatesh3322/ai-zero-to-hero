name: Bug report
description: Something in the app is broken
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: Steps to reproduce, what you expected, and what you saw. }
    validations: { required: true }
  - type: input
    id: url
    attributes: { label: Page URL }
  - type: input
    id: browser
    attributes: { label: Browser and device, placeholder: "Chrome 131 on macOS / Safari on iPhone" }
