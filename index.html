<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AI Zero to Hero — Learn machine learning by running it on real data</title>
    <meta name="description" content="A free, open-source, interactive AI engineering course. Every lesson is an animated system you step through, and ends with a live app running real public data through a real model." />
    <meta name="author" content="Bala Venkatesh" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f4ebe0" />
    <meta name="application-name" content="AI Zero to Hero" />
    <meta name="apple-mobile-web-app-title" content="Zero to Hero" />
    <!--seo-->
    <script>
      // light theme by default; a theme the learner picked is remembered (applied before first paint, no flash)
      try {
        var t = localStorage.getItem('azh:theme-pick');
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>AI Zero to Hero is an interactive course and needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
